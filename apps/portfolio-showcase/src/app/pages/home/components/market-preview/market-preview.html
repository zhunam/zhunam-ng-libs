<div class="flex h-full flex-col justify-center gap-3 bg-base-content px-4 pt-9 pb-4" aria-hidden="true">
  <div class="flex justify-between gap-3 text-xs">
    @for (coin of priceStrip; track coin.symbol) {
      <span class="flex items-center gap-1 text-slate-300" translate="no">
        {{ coin.symbol }} <span class="font-medium text-white">{{ coin.price }}</span>
        <span class="text-green-500">▲</span>
      </span>
    }
  </div>

  <svg viewBox="0 0 200 40" preserveAspectRatio="none" class="h-8 w-full text-[#8ba7a6]">
    <polyline
      points="0,32 25,28 50,30 75,18 100,22 125,12 150,15 175,6 200,10"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>

  <div class="flex flex-col gap-2 rounded-md bg-white/5 p-3">
    @for (coin of miniList; track coin.name) {
      <div class="flex justify-between text-xs text-slate-300" translate="no">
        <span>{{ coin.name }}</span>
        <span class="font-medium text-white">{{ coin.price }}</span>
      </div>
    }
  </div>
</div>
