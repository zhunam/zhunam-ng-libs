<article
  class="price-ticker flex items-center gap-3 rounded-box border border-slate-200 bg-base-100 px-4 py-3"
  [class.price-ticker--flash]="flashing()"
  (animationend)="onFlashAnimationEnd()"
>
  <img [src]="coin().image" [alt]="coin().name" class="h-8 w-8 rounded-full" />

  <div class="flex min-w-0 flex-col">
    <span class="truncate text-sm font-semibold text-base-content">{{ coin().name }}</span>
    <span class="text-xs uppercase text-slate-600">{{ coin().symbol }}</span>
  </div>

  <span class="ml-auto text-sm font-semibold text-base-content">
    {{ coin().currentPrice | currency }}
  </span>

  <span
    class="text-sm font-medium"
    [class.text-green-600]="changeDirection() === 'positive'"
    [class.text-red-600]="changeDirection() === 'negative'"
    [class.text-slate-600]="changeDirection() === 'neutral'"
  >
    {{ coin().changePercentage24h > 0 ? '+' : '' }}{{ coin().changePercentage24h | number: '1.2-2' }}%
  </span>
</article>
