<div class="rounded-box bg-base-100 p-4 shadow-[0_2px_10px_rgba(15,37,42,0.08)]">
  @if (error(); as errorMessage) {
    <app-coin-spinner variant="error" [message]="errorMessage" (retry)="onRetryClick()" />
  } @else if (coins().length === 0) {
    <app-coin-spinner variant="loading" />
  } @else {
    @if (isPaused()) {
      <div
        class="mb-3 flex items-center gap-3 rounded-box border border-slate-200 p-3"
        role="status"
        aria-live="polite"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5 shrink-0 text-slate-600" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <p class="flex-1 text-sm text-slate-600">Live updates paused. Data may be out of date.</p>
        <button type="button" class="btn btn-primary btn-sm" (click)="onResumeClick()">Resume</button>
      </div>
    }
    <div [class.opacity-50]="isPaused()">
      <lib-data-grid [data]="coins()" [columns]="columns" />
    </div>
  }
</div>

<ng-template #imageCell let-coin>
  <img [src]="coin.image" [alt]="coin.name" class="h-6 w-6 rounded-full" />
</ng-template>

<ng-template #changeCell let-coin>
  {{ coin.changePercentage24h > 0 ? '+' : '' }}{{ coin.changePercentage24h | number: '1.2-2' }}%
</ng-template>
