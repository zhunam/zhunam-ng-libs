<div class="drawer gap-6 lg:drawer-open">
  <input id="library-explorer-drawer" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex min-w-0 flex-col gap-8">
    <label
      for="library-explorer-drawer"
      class="drawer-tab btn btn-square fixed top-16 left-0 z-40 rounded-l-none border border-l-0 border-slate-200 bg-base-100 shadow-md transition-all duration-300 ease-out lg:hidden"
    >
      <span class="sr-only">Toggle library explorer</span>
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-5 w-5"
        aria-hidden="true"
      >
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </label>

    <ng-content></ng-content>
  </div>

  <div class="drawer-side">
    <label for="library-explorer-drawer" aria-label="Close library explorer" class="drawer-overlay"></label>
    <aside
      class="h-fit w-72 bg-base-100 border-0 shadow-none p-3 max-lg:border-r max-lg:border-slate-200 lg:w-full lg:rounded-box lg:border lg:border-slate-200"
    >
      <h2 class="mb-2 px-1 text-sm font-semibold text-base-content">Library Explorer</h2>
      <nav class="flex flex-col gap-0.5">
        @for (lib of libraries; track lib.name) {
          @if (lib.route) {
            <a [routerLink]="lib.route" [class]="sidebarLinkClasses(lib.route === currentUrl())"
              ><span translate="no">{{ lib.name }}</span></a
            >
          } @else {
            <span class="flex items-center justify-between rounded-md px-3 py-2 text-sm font-medium text-slate-400">
              <span translate="no">{{ lib.name }}</span>
              <span class="text-xs font-normal">Coming Soon</span>
            </span>
          }
        }
      </nav>
    </aside>
  </div>
</div>
