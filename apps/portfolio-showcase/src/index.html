<!DOCTYPE html>
<!-- data-theme="zhunam" is required: without it, daisyUI v5 still applies
     its own built-in light/dark fallback based on the visitor's
     prefers-color-scheme, overriding this project's fixed theme for
     anyone with dark mode on at the OS/browser level. -->
<html lang="en" data-theme="zhunam">
  <head>
    <meta charset="utf-8" />
    <title>zhunam-dev</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
