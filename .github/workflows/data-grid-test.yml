name: Data Grid Tests

# Runs the data-grid unit test suite with coverage whenever a PR touches the
# library. See libs/data-grid/ROADMAP.md — test execution is currently
# blocked workspace-wide by a Vitest 4.x / @angular/build 21.2.18 bug
# (angular:test-bed-init virtual module), so this workflow is expected to
# fail until that's fixed upstream. It's wired up now so it starts passing
# automatically once it is.
on:
  pull_request:
    paths:
      - "libs/data-grid/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci

      - name: Run data-grid unit tests with coverage
        run: npx nx test data-grid --coverage
