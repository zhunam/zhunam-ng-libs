name: Lib Tests

# Runs each publishable library's unit test suite with coverage whenever a
# PR touches it. See libs/data-grid/ROADMAP.md — test execution is
# currently blocked workspace-wide by a Vitest 4.x / @angular/build 21.2.18
# bug (angular:test-bed-init virtual module), so this workflow is expected
# to fail until that's fixed upstream. It's wired up now so it starts
# passing automatically once it is.
#
# This workflow is a required status check on master (see the repo
# ruleset). A path-filtered `on.pull_request.paths` trigger means GitHub
# never even creates a check run for a PR that doesn't touch these paths,
# so the required check sits "pending" forever and blocks the merge
# (confirmed with a real PR that only added .gitattributes at the repo
# root). The trigger now always fires; whether the real npm ci / nx test
# steps run is instead decided inside the job via a plain `git diff`
# against the PR's base, so a PR with no relevant changes still gets a
# real, fast, passing check run. A plain diff is used instead of a
# third-party paths-filter action to avoid trusting external CI code in a
# public repo for a check this simple.
#
# Paths are listed explicitly per library (not libs/*/**) so adding a new
# libs/* doesn't silently start triggering real test runs before it has a
# project.json `test` target and coverageThresholds set up to match — add
# the new library to both the grep pattern below and the `project` matrix
# once it does.
on:
  pull_request:

jobs:
  test:
    name: Lib Tests (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [data-grid, form-builder, auth, pdf-generator, calendar]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -qE '^libs/(data-grid|form-builder|auth|pdf-generator|calendar)/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      - name: Run ${{ matrix.project }} unit tests with coverage
        if: steps.changes.outputs.relevant == 'true'
        run: npx nx test ${{ matrix.project }} --coverage
